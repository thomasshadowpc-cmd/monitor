<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Monitoring & Telegram (Sans GitHub)</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: system-ui; padding: 2rem; }
        .card { background: #1e293b; padding: 1.5rem; border-radius: 8px; margin-bottom: 1rem; border: 1px solid #334155; }
        .code { font-family: monospace; color: #38bdf8; }
    </style>
</head>
<body>
    <h1>🖥️ Dashboard Monitoring Direct</h1>
    <p>Statut Telegram : <b style="color: #4ade80;">Actif & Écoute</b></p>
    <hr style="margin: 1.5rem 0; border-color: #334155;">

    <div id="devices">Chargement des données...</div>

    <script>
        const TELEGRAM_TOKEN = "8857271057:AAG9ggVUzKfkflBVRKXCoMhoAAcl4O03O9Y";
        const BIN_ID = "65a12345abcde12345678901";
        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        let offset = 0;
        let localData = {};

        async function loadMetrics() {
            try {
                const res = await fetch(API_URL);
                if (res.ok) {
                    const json = await res.json();
                    localData = json.record || {};
                    renderUI();
                }
            } catch (e) { console.error(e); }
        }

        function renderUI() {
            const container = document.getElementById('devices');
            const list = Object.values(localData);
            if (list.length === 0) {
                container.innerHTML = "Aucune machine enregistrée.";
                return;
            }
            container.innerHTML = list.map(d => `
                <div class="card">
                    <h3>💻 ${d.hostname}</h3>
                    <p>IP: <span class="code">${d.ip}</span> | OS: ${d.os} | Vu à: ${d.last_seen}</p>
                    <p>CPU: ${d.cpu.usage}% | RAM: ${d.ram.used_gb}/${d.ram.total_gb} GB (${d.ram.usage}%)</p>
                </div>
            `).join('');
        }

        async function sendTelegram(chatId, text) {
            await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: text, parse_mode: 'HTML' })
            });
        }

        async function processTelegram() {
            try {
                const res = await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/getUpdates?offset=${offset}&timeout=5`);
                if (res.ok) {
                    const data = await res.json();
                    for (const u of data.result) {
                        offset = u.update_id + 1;
                        if (u.message && u.message.text) {
                            const cmd = u.message.text.trim().toLowerCase();
                            const chatId = u.message.chat.id;
                            const list = Object.values(localData);

                            if (cmd === 'user' || cmd === '/user') {
                                let msg = `💻 <b>PC CONNECTÉS (${list.length}) :</b>\n\n`;
                                list.forEach(d => {
                                    msg += `• <b>${d.hostname}</b>\n  └ IP : <code>${d.ip}</code> | Vu : ${d.last_seen}\n\n`;
                                });
                                await sendTelegram(chatId, msg || "Aucun PC.");
                            } else if (cmd === 'spec' || cmd === '/spec') {
                                for (const d of list) {
                                    const apps = d.apps ? d.apps.slice(0, 10).join(', ') + '...' : 'Aucun';
                                    const card = `🖥️ <b>${d.hostname}</b>\n🌐 IP: <code>${d.ip}</code>\n⚙️ CPU: ${d.cpu.name} (${d.cpu.usage}%)\n🧠 RAM: ${d.ram.used_gb}/${d.ram.total_gb} GB (${d.ram.usage}%)\n📦 Apps: <i>${apps}</i>`;
                                    await sendTelegram(chatId, card);
                                }
                            } else {
                                await sendTelegram(chatId, "<b>Commandes :</b>\n👉 <code>user</code>\n👉 <code>spec</code>");
                            }
                        }
                    }
                }
            } catch (e) {}
            setTimeout(processTelegram, 2000);
        }

        window.onload = () => {
            loadMetrics();
            setInterval(loadMetrics, 10000);
            processTelegram();
        };
    </script>
</body>
</html>
